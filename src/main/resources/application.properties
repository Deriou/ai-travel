spring.application.name=ai-travel

# Automatically load each member's local configuration.
spring.config.import=optional:classpath:application-local.properties

# Map city_name from SQL to cityName in Java.
mybatis.configuration.map-underscore-to-camel-case=true

# Show MyBatis SQL, parameters, and result counts during training.
logging.level.cn.edu.hebau.aitravel.mapper=DEBUG
# User SQL parameters contain password hashes, so do not print them.
logging.level.cn.edu.hebau.aitravel.mapper.UserMapper=INFO

# Login token lifetime. The signing key jwt.secret is in application-local.properties.
jwt.expire-hours=24

# Users are stored in MySQL; disable Spring Boot's generated in-memory default user.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
